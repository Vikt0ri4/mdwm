# ============================================================================
#  picom.conf  —  x11-misc/picom-13
#
#  配套:打了 monet 补丁的 dwm(悬浮胶囊 bar)+ ~/.config/dwm/statusbar.sh
#  这份是仓库存档,实际使用位置是 ~/.config/picom/picom.conf
#      cp ~/dsh/dsh_workspace/wall-monet/contrib/picom.conf ~/.config/picom/picom.conf
#  picom_toggle.sh 的 find_conf() 首个查找路径正是 ~/.config/picom/picom.conf,
#  而 /etc/picom.conf 与 ~/.config/picom.conf 都不存在,所以放错位置脚本会直接退出。
#
#  ---------------------------------------------------------------------------
#  三条设计依据(都是实测,不是猜的)
#
#   1. bar 是 depth=32 ARGB 的**矩形**窗口:dwm.c:1018 用
#      drw_rect(drw, 0, 0, m->bw, bh, 1, 1) 铺满整块,而 dwm 只给**托盘**做了
#      XShape 圆角(trayshape(),dwm.c:2755)。
#      => 「悬浮胶囊」的圆角完全来自 picom 的 corner-radius。
#         class_g='dwm' 那条规则必须留在 rules 的最后,否则会被前面的规则盖掉
#         (rules 语义:按顺序匹配,同一选项后者覆盖)。
#
#   2. 托盘是 depth=24 的不透明窗口 => 它本来就透不出模糊,理应豁免;
#      它的圆角已经由 dwm 用 XShape 裁好,picom 再加圆角是多余的。
#
#   3. window_type 的合法名 = _NET_WM_WINDOW_TYPE_* 去掉前缀后的小写名。
#      本机实测存在:normal dialog menu popup_menu dropdown_menu combo tooltip
#      notification utility splash dock desktop toolbar dnd。
#      注意:'notification' 不是 'notify'(写 notify 永远不会命中),
#      而 'modal' 不是标准 EWMH 类型,写了也是死规则。
#
#  ---------------------------------------------------------------------------
#  rules 是 v13 的正式机制(man picom 的 WINDOW RULES 一节推荐它取代旧写法)。
#  一旦使用 rules,以下旧选项全部失效(配了也只会打印警告):
#    shadow-exclude / blur-background-exclude / fade-exclude / focus-exclude /
#    rounded-corners-exclude / opacity-rule / corner-radius-rules / wintypes ...
#  另外:rules 模式下**全屏窗口不再自动去掉圆角**,所以下面有一条 fullscreen 规则。
# ============================================================================

# ---------- 后端 ----------
backend    = "glx";          # dual_kawase 只有 glx 支持,xrender 下会被直接拒绝
vsync      = false;          # 延迟优先;全屏让路交给 unredir-if-possible
use-damage = true;

# ---------- 全屏自动让路 ----------
unredir-if-possible = true;

# ---------- 模糊 ----------
blur-background       = true;          # 默认全开,弹窗在后面按 window_type 关掉
blur-background-frame = false;
blur-background-fixed = false;
blur-method           = "dual_kawase";
blur-strength         = 3;             # 轻中度:壁纸的大结构还看得出来(7 会糊成一片色)
# 故意不写 blur-deviation:它只对 gaussian 生效,在 dual_kawase 下是死配置。
# 也故意不写 unredir-on-unknown-window:picom-13 里没有这个选项(实测 --help 与
# man 都查不到),写进去只会被静默忽略。

# ---------- 阴影 ----------
shadow          = true;
shadow-radius   = 12;
shadow-opacity  = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color    = "#000000";

# ---------- 淡入淡出 ----------
fading        = true;
fade-in-step  = 0.03;
fade-out-step = 0.03;
fade-delta    = 4;

# ---------- 杂项 ----------
detect-rounded-corners = true;
detect-client-opacity  = true;

rules = (
    # 1) 普通窗口默认:16px 圆角
    { corner-radius = 16; },

    # 2) 焦点相关不透明度(bar/st 除外:它们用自己的 ARGB alpha,不能被 opacity 蒙版接管)
    { match = "focused";  opacity = 0.95; },
    { match = "!focused && !class_g = 'dwm' && !class_g = 'st-256color' && !class_g = 'dmenu'"; opacity = 0.90; },

    # 3) 弹窗类:半透明,但**不模糊**、无阴影、无圆角
    { match = "window_type = 'dialog' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo' || window_type = 'tooltip' || window_type = 'notification' || window_type = 'utility' || window_type = 'splash' || window_type = 'dnd'";
      opacity = 0.9; blur-background = false; shadow = false; corner-radius = 0; },

    # 4) 面板/桌面:不透明、不模糊、不淡入
    { match = "window_type = 'dock' || window_type = 'desktop'";
      opacity = 1; blur-background = false; shadow = false; corner-radius = 0; fade = false; },

    # 5) 全屏不做圆角(rules 模式下不再自动豁免)
    { match = "fullscreen"; corner-radius = 0; },

    # 6) 游戏/特殊应用完全豁免
    { match = "class_g = 'osu!'";    shadow = false; blur-background = false; fade = false; opacity = 1; corner-radius = 0; },
    { match = "class_g = 'N.E.K.O'"; shadow = false; blur-background = false; fade = false; opacity = 1; corner-radius = 0; },

    # 7) 托盘:depth=24 无法自身透明,由 dwm 用 XShape 裁成图标矩形
    { match = "class_g = 'dwm-systray'"; shadow = false; blur-background = false; opacity = 1; fade = false; corner-radius = 0; },

    # 8) dwm 胶囊 bar —— 必须最后,盖掉上面的 fade/圆角
    // 注意:这里**不要**写 opacity。写了 opacity 的窗口,picom 会用自己的
    // opacity 蒙版去合成,而不是用窗口自带的 ARGB alpha —— 结果就是 dwm 画进去的
    // 半透明像素只被"预乘"了一遍,屏幕上看到的是变暗的颜色而不是透出的壁纸
    // (实测:palette 写 0x3a 时 bar 反而更暗)。去掉它,picom 才会按 alpha 混合。
    // shadow 也必须关:picom 把阴影画在窗口后面,会透过半透明的 bar 显形,
    // 表现为 bar 顶部比底部暗(实测)。
    { match = "class_g = 'dwm'"; corner-radius = 16; blur-background = true; shadow = false; fade = false; },

    # 9) st 终端:自己画 ARGB alpha;不要 opacity 蒙版,阴影会透过半透明背景显形
    # 10) dmenu: 不透明、无阴影;圆角/字体由全局规则和 dmenu patch 负责
    { match = "class_g = 'dmenu'"; opacity = 1; shadow = false; },
    { match = "class_g = 'st-256color'"; shadow = false; blur-background = true; fade = false; },
);
